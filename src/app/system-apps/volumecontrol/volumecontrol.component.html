<div class="volume-control-container">
    <div class="volume-control-heading">
        <p class="volume-control-heading-txt">Speakers (Audio)</p>
    </div>
    <div class="volume-control-body">
      <div class="volume-control-head"> 
        <figure class="volume-control-fig">
            <img class="volume-control-img" [src]="audioIcon" alt="Volume level indicator"/>
        </figure>
      </div>

      <div class="volume-control-mid">
        <!-- Bind the slider position to the real volume so the thumb and the
             numeric label always agree. -->
        <input type="range" min="0" max="100" [value]="adjustedVolume" (input)="onVolumeSliderChange($event)"
               class="volume-control-slider" id="volumeControlSlider"
               aria-label="Speaker volume" [attr.aria-valuetext]="adjustedVolume + ' percent'">
      </div>

      <div class="volume-control-tail"> 
        <p class="volume-control-tail-txt">{{adjustedVolume}}</p>
      </div>
    </div>
  </div>
