<div class="task-bar-nav" [@tskBarSlideStatusAnimation]="slideState" [style.opacity]="taskBarOpacity" 
    (click)="hideContextMenus()" 
    (contextmenu)="showTaskBarContextMenu($event)" id="the-window-taskbar"> 
    <button 
        type="button"
        id="cheetah_start_btn"
        class="cheetah-start-button"
        (mouseenter)="showStartMenuToolTip()" 
        (mouseleave)="hideToolTip()"  
        (click)="showStartMenu($event)"> 
            <svg height="17" width="17" 
                viewBox="0 0 488 512">
                <path d="M0 93.7l183.6-25.3v177.4H0V93.7zm0 324.6l183.6 25.3V268.4H0v149.9zm203.8 28L448 480V268.4H203.8v177.9zm0-380.6v180.1H448V32L203.8 65.7z" />
            </svg>
    </button>

    <div 
        id="cheetah_search_btn"
        class="main-taskbar-search-cntnr" 
        [class.active]="isSearchWindowVisible" 
        (mouseenter)="showSearchWindowToolTip()"
        (mouseleave)="hideToolTip()" > 
        <figure  class="taskbar-search-fig" (click)="hideShowSearch($event)">
            <img alt="search-img" class="taskbar-search-img" [src]="searchIcon">
        </figure>
    </div>

    <div class="main-taskbar-space"> </div>

    <ng-content> </ng-content> 
</div>
