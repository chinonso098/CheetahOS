<cos-primarywindow
  [runningProcessID]="this.processId"
  [processAppIcon]="this.icon"
  [processAppName]="this.name"
  [isMaximizable]="this.isMaximizable"
  [minimumWindowWidth]="MIN_WIDTH_PX" [minimumWindowHeight]="MIN_HEIGHT_PX"
  [priorUId]="this.priorUId"
>
  <div class="editor-main-container" #editorRoot (click)="focusWindow($event)"
    (contextmenu)="silenceCtxEvt($event)">
    <!-- Quill mounts here -->
    <div class="editor-surface" #editorSurface></div>

    <!-- Status bar (fixed at bottom of editor area) -->
    <div class="editor-statusbar" role="status" aria-live="polite">
      <div class="editor-statusbar__left">
        <span class="sb-item">Ln {{ cursorLine }}, Col {{ cursorCol }}</span>
        <span class="sb-sep">|</span>
        <span class="sb-item">{{ selectedCount }} selected</span>
      </div>

      <div class="editor-statusbar__right">
        <span class="sb-item" [class.is-dirty]="isDirty">
          {{ isDirty ? 'Unsaved' : 'Saved' }}
        </span>

        <button
          type="button"
          class="sb-btn"
          (click)="saveFile()"
          [disabled]="!isReady || !isDirty || isSaving"
          title="Save (Ctrl+S)"
        >
          {{ isSaving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </div>
  </div>
</cos-primarywindow>
